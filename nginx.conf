server {
    listen NGINX_PORT;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml image/jpeg image/png;
    gzip_min_length 1024;

    # Vary tells any CDN / intermediary cache to key on Accept-Encoding.
    # Without it, a proxy that receives a gzipped response can serve it to a
    # client that didn't request gzip encoding. Cheap correctness win — always.
    add_header Vary "Accept-Encoding" always;

    # SECURITY_AUDIT.md § M3-M6 — defense-in-depth headers for the static site.
    # nginx `add_header` inheritance resets whenever a nested location declares
    # any add_header of its own — so the 5 security headers must be repeated in
    # `location = /index.html` below, or they drop off the /index.html response.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    add_header Cache-Control "public, max-age=31536000, immutable" always;

    # The homepage is served HERE, not through the `index` directive, and that
    # is load-bearing now that `/index.html` 301s (below).
    #
    # `index index.html;` answers a request for `/` with an INTERNAL REDIRECT
    # to `/index.html`, and an internal redirect re-runs location matching —
    # so it would land on `location = /index.html`, hit its `return 301 /`, and
    # bounce the homepage forever. `try_files` behaves differently: when it
    # finds an existing file it keeps processing in the CURRENT location, no
    # re-match, no loop. (Same property is what lets `location /` serve
    # `/commercial-industrial` from `commercial-industrial.html` while the
    # `.html` URL itself redirects.) Verified by container probe, not assumed.
    location = / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        return 301 /$is_args$args;
    }

    location / {
        # Static marketing site — a missing path is a real 404, not an SPA
        # deep-link that should rewrite to /. Prior `try_files ... /index.html`
        # silently returned 200 on typos + broken inbound links, hurting SEO
        # and burying the fact that a link was wrong.
        #
        # `$uri.html` is what makes the extensionless URLs resolve here. Every
        # internal link, canonical, sitemap loc and JSON-LD url uses the clean
        # form (`/commercial-industrial`) because that is what Cloudflare —
        # the host of record — serves 200 on. Without this the Railway
        # fallback would 404 on literally every link on the site. The chain
        # still ends in `=404`, so typos stay real 404s (locked by
        # tests/test_nginx_headers.py contract 6).
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        # nginx add_header inheritance resets on any nested add_header, so the
        # 5 defense-in-depth headers (SECURITY_AUDIT.md § M3-M6) are repeated
        # here — same pattern as `/index.html` / `/robots.txt` / `/sitemap.xml`
        # above. Without this, 404 responses ship no HSTS / XCTO / XFO /
        # Referrer-Policy / Permissions-Policy — an MITM downgrade + iframe
        # spoof surface on every mistyped URL. Locked by tests/test_nginx_headers.py.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # =======================================================================
    # CANONICAL REDIRECTS — must stay byte-for-byte equivalent to `_redirects`
    # =======================================================================
    # The site has ONE canonical URL shape: the clean, extensionless path.
    # Cloudflare (host of record) 301s every `.html` form to it. Until
    # 2026-08-12 nginx did not: `location /`'s `try_files $uri ...` found the
    # file and answered **200**, so a failover to this Railway fallback
    # silently re-created the duplicate-content shape the canonical arc exists
    # to remove — every page reachable at two URLs, both 200. Found by a real
    # `make test-container` run.
    #
    # PRECEDENCE: these are exact (`location = /x`) matches on purpose. nginx
    # resolves locations by SPECIFICITY, not by file order — an exact match
    # short-circuits the search before any prefix (`location /`) or regex
    # location is considered, wherever it sits in the file. (Cloudflare's
    # `_redirects` is the opposite: FIRST matching line wins, so order is the
    # tie-breaker there. Do not carry assumptions across the two files.)
    #
    # HEADERS: nginx `add_header` inheritance resets whenever a nested block
    # declares any add_header of its own, so all 5 defense-in-depth headers
    # (SECURITY_AUDIT.md § M3-M6) are repeated in every block below — a 301 is
    # a real response and ships without HSTS otherwise. Cache-Control is 1h,
    # not the server's 1y immutable default: a hard-cached redirect is a
    # one-way door if a destination ever changes.
    #
    # QUERY STRINGS: `$is_args$args` is MONEY CODE, not decoration. Unlike
    # Cloudflare's `_redirects` (which carries the query through the hop —
    # verified 2026-08-12), nginx's `return` sends exactly the URL written
    # here and drops `?...` on the floor. Without the suffix, a bio-link or
    # ad click on `/commercial-industrial.html?intent=bid-commercial&
    # utm_source=ig` would land on the lane page with the intake form
    # unprefilled and the attribution gone. Caught by a Codex second opinion,
    # then reproduced and re-verified in the container.
    #
    # Parity with `_redirects` is asserted by tests/test_url_shape.py
    # contract 6, which derives ONE expected map and checks both stacks
    # against it — so neither file can drift from the other.

    location = /commercial-industrial.html {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Cache-Control "public, max-age=3600" always;
        return 301 /commercial-industrial$is_args$args;
    }

    location = /residential-construction.html {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Cache-Control "public, max-age=3600" always;
        return 301 /residential-construction$is_args$args;
    }

    location = /south-fulton-distribution.html {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Cache-Control "public, max-age=3600" always;
        return 301 /south-fulton-distribution$is_args$args;
    }

    location = /accessibility.html {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Cache-Control "public, max-age=3600" always;
        return 301 /accessibility$is_args$args;
    }

    # Retired lane page (2026-07-17 two-path restructure): Home Repair folded
    # into the residential page as an in-page section. Permanent redirect keeps
    # old inbound links + SEO equity alive; the #home-repair fragment lands the
    # visitor on the absorbed section (Cloudflare drops the fragment only
    # because fragment support is undocumented for CF-style `_redirects` — the
    # destination PAGE is identical on both stacks).
    #
    # BOTH forms redirect. `/home-repair` (extensionless) is a live inbound-link
    # shape too, and Cloudflare 301s it; nginx used to 404 it, because the file
    # it would have resolved through was deleted in the restructure.
    location = /home-repair.html {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Cache-Control "public, max-age=3600" always;
        # Clean extensionless target, matching _redirects on Cloudflare: the
        # `.html` form would chain 301 -> 307 -> 200 on the live host.
        return 301 /residential-construction$is_args$args#home-repair;
    }

    location = /home-repair {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Cache-Control "public, max-age=3600" always;
        return 301 /residential-construction$is_args$args#home-repair;
    }

    # Shared money-path JS — unversioned filename, so the server default of
    # 1y immutable would poison every visitor's cache on each deploy (a form
    # fix could take a year to reach a returning browser). 1h cache matches
    # the crawler files below. nginx add_header inheritance resets on any
    # nested add_header, so the 5 defense-in-depth headers are repeated.
    location = /big7.js {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # SEO crawler files — 1h cache (server default of 1y immutable is wrong for
    # these; Google Bot re-fetches on its own schedule but downstream CDNs and
    # browsers should not pin them for a year). nginx add_header inheritance
    # resets on any nested add_header, so the 5 defense-in-depth headers
    # (SECURITY_AUDIT.md § M3-M6) are repeated here — same pattern as
    # `/index.html` above.
    location = /robots.txt {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Cache-Control "public, max-age=3600" always;
    }
    location = /sitemap.xml {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Cache-Control "public, max-age=3600" always;
    }
}
